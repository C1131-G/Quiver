<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'"
    />
    <title>Quiver Dashboard</title>
    <style>
      :root {
        color-scheme: light dark;
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
        --muted-foreground: oklch(0.556 0 0);
        --border: oklch(0.922 0 0);
        --input: oklch(0.922 0 0);
        --primary: oklch(0.505 0.213 27.518);
        --primary-foreground: oklch(0.985 0 0);
        --radius-lg: 0.875rem;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: oklch(0.145 0 0);
          --foreground: oklch(0.985 0 0);
          --muted-foreground: oklch(0.708 0 0);
          --border: oklch(1 0 0 / 10%);
          --input: oklch(1 0 0 / 15%);
          --primary: oklch(0.444 0.177 26.899);
          --primary-foreground: oklch(0.985 0 0);
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        align-items: center;
        background: var(--background);
        color: var(--foreground);
        display: flex;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        justify-content: center;
        padding: 1.5rem;
      }
      main {
        width: 100%;
        max-width: 24rem;
      }
      header {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        margin-bottom: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
      }
      p {
        color: var(--muted-foreground);
        font-size: 0.875rem;
        margin: 0;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }
      label {
        display: block;
        font-size: 0.875rem;
        font-weight: 500;
        margin-bottom: 0.5rem;
      }
      .fake-input {
        background: var(--background);
        border: 1px solid var(--input);
        border-radius: calc(var(--radius-lg) * 0.6);
        color: var(--muted-foreground);
        font-size: 0.875rem;
        height: 2.25rem;
        opacity: 0.7;
        padding: 0 0.75rem;
        display: flex;
        align-items: center;
      }
      button {
        align-items: center;
        background: var(--primary);
        border: none;
        border-radius: calc(var(--radius-lg) * 0.6);
        color: var(--primary-foreground);
        cursor: default;
        display: flex;
        font-size: 0.875rem;
        font-weight: 500;
        gap: 0.5rem;
        height: 2.5rem;
        justify-content: center;
        opacity: 0.9;
        width: 100%;
      }
      .spinner {
        animation: spin 0.8s linear infinite;
        border: 2px solid
          color-mix(in oklch, var(--primary-foreground) 40%, transparent);
        border-radius: 50%;
        border-top-color: var(--primary-foreground);
        height: 14px;
        width: 14px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Welcome back</h1>
        <p>Log in to your Quiver Dashboard account</p>
      </header>
      <form>
        <div>
          <label for="username">Username</label>
          <div class="fake-input" id="username"></div>
        </div>
        <div>
          <label for="password">Password</label>
          <div class="fake-input" id="password"></div>
        </div>
        <button disabled type="button">
          <span class="spinner" role="status" aria-label="Starting"></span>
          Starting…
        </button>
      </form>
    </main>
  </body>
</html>
