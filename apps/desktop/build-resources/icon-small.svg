<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    Optically simplified variant used for 16-48px ICO entries: the dashed 360
    dial and the third target ring turn to noise at taskbar size, so this drops
    them and thickens everything that is left.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="55%" stop-color="#132038" />
      <stop offset="100%" stop-color="#0A1A2F" />
    </linearGradient>
    <radialGradient id="core" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0%" stop-color="#CFFAFE" />
      <stop offset="55%" stop-color="#22D3EE" />
      <stop offset="100%" stop-color="#0E7490" />
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)" />

  <g fill="none">
    <circle cx="512" cy="512" r="348" stroke="#E2E8F0" stroke-opacity="0.95" stroke-width="88" />
    <circle cx="512" cy="512" r="212" stroke="#22D3EE" stroke-width="88" />
  </g>
  <circle cx="512" cy="512" r="96" fill="url(#core)" />

  <g>
    <path d="M138 886 L84 832 L200 716 L254 770 Z" fill="#67E8F9" />
    <path d="M138 886 L192 940 L308 824 L254 770 Z" fill="#0E7490" />
    <path d="M190 834 L462 562" stroke="#F8FAFC" stroke-width="76" stroke-linecap="round" />
    <path d="M602 422 L404 466 L558 620 Z" fill="#FFFFFF" />
  </g>
</svg>
